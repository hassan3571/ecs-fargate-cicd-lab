AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One-time bootstrap for the ECS Fargate CI/CD lab. Creates the GitHub OIDC
  identity provider, the S3 bucket for Terraform state, and the IAM role that
  GitHub Actions assumes to run Terraform. Everything else is created by
  Terraform from GitHub Actions.

Parameters:
  ProjectName:
    Type: String
    Default: ecslab
    AllowedPattern: "^[a-z][a-z0-9-]{1,11}$"
    Description: Short lowercase prefix for resource names (2-12 characters).

  GitHubRepo:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    Description: GitHub repository as owner/name (case-sensitive).

  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if this AWS account already has the token.actions.githubusercontent.com provider.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  TerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-tfstate-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub "${TerraformStateBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # Assumed by the "Infrastructure" workflow, only from jobs running in the
  # protected GitHub environment named "infra".
  TerraformRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-gha-terraform"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringLike:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepo}:environment:infra"
      # PowerUserAccess covers every service the lab uses except IAM.
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess"
      Policies:
        - PolicyName: project-scoped-iam
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # IAM roles can only be managed if their name starts with the project prefix.
              - Sid: ManageProjectRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*"
              # The only managed policy that may be attached is the ECS execution policy.
              - Sid: AttachOnlyEcsExecutionPolicy
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*"
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
              - Sid: ReadOidcProvider
                Effect: Allow
                Action:
                  - iam:GetOpenIDConnectProvider
                  - iam:ListOpenIDConnectProviders
                Resource: "*"
              # The role can never change its own permissions or trust policy.
              - Sid: DenySelfModification
                Effect: Deny
                Action: "iam:*"
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-gha-terraform"

Outputs:
  TerraformRoleArn:
    Description: GitHub environment "infra" variable AWS_TERRAFORM_ROLE_ARN
    Value: !GetAtt TerraformRole.Arn
  TerraformStateBucket:
    Description: GitHub environment "infra" variable TF_STATE_BUCKET
    Value: !Ref TerraformStateBucket
