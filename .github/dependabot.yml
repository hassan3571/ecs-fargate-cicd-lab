# Keeps dependencies, base images and GitHub Actions up to date.
# Each update arrives as a pull request, so it goes through CI and scans first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app/backend
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /app/frontend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /app/backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /app/frontend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/shared
    schedule:
      interval: monthly

  - package-ecosystem: terraform
    directory: /infra/env
    schedule:
      interval: monthly
