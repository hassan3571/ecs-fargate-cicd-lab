# Installs a pinned Trivy release and verifies its SHA-256 checksum before use,
# so a tampered download can never run in the pipeline.
# To upgrade: take the new version and its "Linux-64bit.tar.gz" line from
# https://github.com/aquasecurity/trivy/releases (trivy_<version>_checksums.txt).
name: Set up Trivy
description: Install a pinned, checksum-verified Trivy binary

inputs:
  version:
    description: Trivy version (without the leading v)
    default: "0.75.0"
  sha256:
    description: SHA-256 of trivy_<version>_Linux-64bit.tar.gz
    default: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"

runs:
  using: composite
  steps:
    - name: Download, verify and install Trivy
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        file="trivy_${VERSION}_Linux-64bit.tar.gz"
        curl -sSfL -o "$RUNNER_TEMP/$file" \
          "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/${file}"
        echo "${SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" trivy
        sudo install -m 0755 "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
        trivy --version
